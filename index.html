<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repetition Tracker</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 12px;
    max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 1.3rem; padding: 8px 0; color: var(--accent); }
  h2 { font-size: 1rem; color: var(--text-dim); margin: 16px 0 8px; }

  /* Auth screen */
  #auth-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 80vh; gap: 16px;
  }
  #auth-screen h1 { font-size: 1.5rem; }
  #auth-screen input {
    width: 200px; padding: 12px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 1.2rem; text-align: center;
    letter-spacing: 4px;
  }
  #auth-screen input:focus { outline: none; border-color: var(--accent); }
  #auth-error { color: var(--red); font-size: 0.85rem; min-height: 20px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab {
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); cursor: pointer;
    font-size: 0.85rem; transition: all 0.15s;
  }
  .tab:hover { border-color: var(--accent); }
  .tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .badge {
    display: inline-block; background: var(--red); color: #fff;
    border-radius: 10px; padding: 1px 7px; font-size: 0.75rem; margin-left: 4px;
  }

  /* Task cards */
  .task-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .task-card:hover { border-color: var(--accent); }
  .task-card.overdue { border-left: 3px solid var(--red); }
  .task-card.due-today { border-left: 3px solid var(--green); }
  .task-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; word-break: break-word; }
  .task-meta { font-size: 0.78rem; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .task-meta span { white-space: nowrap; }
  .task-notes { font-size: 0.82rem; color: var(--text-dim); font-style: italic; margin: 4px 0; }
  .task-links a { font-size: 0.8rem; color: var(--accent); text-decoration: none; margin-right: 8px; }
  .task-links a:hover { text-decoration: underline; }
  .task-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  /* Buttons */
  btn, button {
    padding: 6px 12px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    font-size: 0.8rem; transition: all 0.15s;
  }
  button:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-green { background: var(--green); color: var(--bg); border-color: var(--green); }
  .btn-red { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-orange { background: var(--orange); color: var(--bg); border-color: var(--orange); }
  .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
  .btn-undo { background: var(--purple); color: var(--bg); border-color: var(--purple); pointer-events: auto; }

  /* Form */
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 3px; }
  input, textarea, select {
    width: 100%; padding: 8px 10px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 0.9rem; font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }

  /* Utility */
  .hidden { display: none !important; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 0.9rem; }
  .stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; text-align: center; flex: 1; min-width: 80px; }
  .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.7rem; color: var(--text-dim); }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: var(--bg); padding: 10px 20px;
    border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    z-index: 100; display: flex; align-items: center; gap: 10px;
  }
  .search-bar { margin-bottom: 12px; }
  input[type="checkbox"] { width: auto; margin-right: 6px; accent-color: var(--accent); }
  .overdue-tag { color: var(--red); font-weight: 600; font-size: 0.75rem; }
  .due-tag { color: var(--green); font-weight: 600; font-size: 0.75rem; }
  #loading { text-align: center; padding: 60px 0; color: var(--text-dim); }
  .seq-viz { font-size: 0.75rem; color: var(--purple); }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <h1>🔒 Repetition Tracker</h1>
  <input type="password" id="auth-input" placeholder="••••••" maxlength="6" inputmode="numeric" autofocus>
  <div id="auth-error"></div>
</div>

<!-- MAIN APP -->
<div id="main-app" class="hidden">
  <h1>📋 Repetition Tracker</h1>

  <div id="loading">Connecting to database...</div>
  <div id="app" class="hidden">

    <div class="stats-bar">
      <div class="stat"><div class="stat-num" id="stat-due">0</div><div class="stat-label">Due Today</div></div>
      <div class="stat"><div class="stat-num" id="stat-overdue" style="color:var(--red)">0</div><div class="stat-label">Overdue</div></div>
      <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="today" onclick="switchTab('today')">Today <span id="badge-today" class="badge hidden">0</span></div>
      <div class="tab" data-tab="overdue" onclick="switchTab('overdue')">Overdue <span id="badge-overdue" class="badge hidden">0</span></div>
      <div class="tab" data-tab="all" onclick="switchTab('all')">All Tasks</div>
      <div class="tab" data-tab="add" onclick="switchTab('add')">+ Add</div>
    </div>

    <div id="view-today">
      <div id="list-today"></div>
    </div>

    <div id="view-overdue" class="hidden">
      <button class="btn-orange btn-sm" onclick="catchUpAll()" style="margin-bottom:10px">⚡ Catch-Up All Overdue</button>
      <div id="list-overdue"></div>
    </div>

    <div id="view-all" class="hidden">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search tasks..." oninput="renderAll()">
      </div>
      <div id="list-all"></div>
    </div>

    <div id="view-add" class="hidden">
      <h2 id="form-title">Add New Task</h2>
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label>Task Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Coding_Leetcode_197. Rising Temperature">
      </div>
      <div class="form-group">
        <label>Links (one per line)</label>
        <textarea id="f-links" placeholder="https://leetcode.com/problems/..."></textarea>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="f-notes" placeholder="Optional notes..."></textarea>
      </div>
      <div class="form-group">
        <label>First Date (defaults to today)</label>
        <input type="date" id="f-date">
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" onclick="saveTask()">Save Task</button>
        <button onclick="cancelEdit()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ============================================================
// 🔧 FIREBASE CONFIG - REPLACE WITH YOUR VALUES
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBOl2pAIJFrCG_p2qbmENYnHPs56FE4AeE",
  authDomain: "rep-tracker-df2e8.firebaseapp.com",
  databaseURL: "https://rep-tracker-df2e8-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "rep-tracker-df2e8",
  storageBucket: "rep-tracker-df2e8.firebasestorage.app",
  messagingSenderId: "1001251936735",
  appId: "1:1001251936735:web:e97af917453089d0d68c6a",
  measurementId: "G-87BVF7E3DS"
};
// ============================================================

const PASSCODE = '246879';
let allTasks = {};
let currentTab = 'today';
let undoStack = [];
let toastTimer = null;
let firebaseInitialized = false;

// ============================================================
// AUTH
// ============================================================
const authInput = document.getElementById('auth-input');
authInput.addEventListener('input', () => {
  document.getElementById('auth-error').textContent = '';
  if (authInput.value.length === 6) {
    if (authInput.value === PASSCODE) {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      sessionStorage.setItem('rep_auth', '1');
      if (!firebaseInitialized) bootApp();
    } else {
      document.getElementById('auth-error').textContent = 'Wrong passcode';
      authInput.value = '';
    }
  }
});

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('rep_auth') === '1') {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    bootApp();
  }
});

function bootApp() {
  if (firebaseInitialized) return;
  firebaseInitialized = true;
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  firebase.initializeApp(firebaseConfig);
  firebase.auth().signInAnonymously().then(() => {
    window.db = firebase.database();
    window.tasksRef = window.db.ref('tasks');
    initFirebase();
  }).catch((err) => {
    document.getElementById('loading').textContent = '❌ Auth failed: ' + err.message;
  });
}

// ============================================================
// DATE HELPERS
// ============================================================
function todayStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function parseDate(str) {
  const [d, m, y] = str.split('/').map(Number);
  return new Date(y, m - 1, d);
}
function formatDate(date) {
  return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function isToday(ds) { return ds === todayStr(); }
function isOverdue(ds) { return parseDate(ds) < new Date(new Date().toDateString()); }
function htmlToDate(h) { const [y,m,d] = h.split('-'); return `${d}/${m}/${y}`; }
function dateToHtml(s) { const [d,m,y] = s.split('/'); return `${y}-${m}-${d}`; }

// ============================================================
// SPACED REPETITION
// ============================================================
function getNextRevision(task) {
  const revDate = parseDate(task.revisionDate);
  const seq = task.latestUsedSeqNumber;
  const inc = (seq === 0) ? 3 : (seq + 2);
  const nd = new Date(revDate); nd.setDate(nd.getDate() + inc);
  return {
    newRevisionDate: formatDate(nd),
    previousRevisionDate: task.revisionDate,
    newRepetitionCount: task.repetitionCount + 1,
    newSeqNumber: (seq === 0) ? 3 : (seq + 2)
  };
}

function catchUpTask(task) {
  const today = new Date(new Date().toDateString());
  let revDate = parseDate(task.revisionDate);
  let prevDate = task.previousRevisionDate ? parseDate(task.previousRevisionDate) : revDate;
  let seq = task.latestUsedSeqNumber, rep = task.repetitionCount, od = task.overDueCount || 0;
  while (revDate < today) {
    const inc = (seq === 0) ? 3 : (seq + 2);
    prevDate = revDate;
    revDate = new Date(revDate); revDate.setDate(revDate.getDate() + inc);
    seq = (seq === 0) ? 3 : (seq + 2); rep++; od++;
  }
  return { revisionDate: formatDate(revDate), previousRevisionDate: formatDate(prevDate),
    latestUsedSeqNumber: seq, repetitionCount: rep, overDueCount: od };
}

// ============================================================
// FIREBASE
// ============================================================
function initFirebase() {
  tasksRef.on('value', (snap) => {
    allTasks = snap.val() || {};
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    renderStats(); renderCurrentTab();
  }, (err) => {
    document.getElementById('loading').textContent = '❌ Connection failed.';
    console.error(err);
  });
}
function addTask(t) { return tasksRef.push().set(t); }
function updateTask(k, u) { return tasksRef.child(k).update(u); }
function deleteTask(k) { return tasksRef.child(k).remove(); }

// ============================================================
// RENDER
// ============================================================
function getTaskList() { return Object.entries(allTasks).map(([k,t]) => ({...t, _key:k})); }

function renderStats() {
  const tasks = getTaskList(), td = todayStr();
  const due = tasks.filter(t => t.revisionDate === td).length;
  const ov = tasks.filter(t => isOverdue(t.revisionDate)).length;
  document.getElementById('stat-due').textContent = due;
  document.getElementById('stat-overdue').textContent = ov;
  document.getElementById('stat-total').textContent = tasks.length;
  const bT = document.getElementById('badge-today'), bO = document.getElementById('badge-overdue');
  if (due > 0) { bT.textContent = due; bT.classList.remove('hidden'); } else bT.classList.add('hidden');
  if (ov > 0) { bO.textContent = ov; bO.classList.remove('hidden'); } else bO.classList.add('hidden');
}

function renderCurrentTab() {
  if (currentTab === 'today') renderToday();
  else if (currentTab === 'overdue') renderOverdue();
  else if (currentTab === 'all') renderAll();
}

function renderToday() {
  const tasks = getTaskList().filter(t => isToday(t.revisionDate)).sort((a,b) => (a.taskName||'').localeCompare(b.taskName||''));
  const el = document.getElementById('list-today');
  el.innerHTML = tasks.length === 0 ? '<div class="empty-state">🎉 No tasks due today!</div>' : tasks.map(t => taskCard(t)).join('');
}

function renderOverdue() {
  const tasks = getTaskList().filter(t => isOverdue(t.revisionDate)).sort((a,b) => parseDate(a.revisionDate) - parseDate(b.revisionDate));
  const el = document.getElementById('list-overdue');
  el.innerHTML = tasks.length === 0 ? '<div class="empty-state">✅ No overdue tasks!</div>' : tasks.map(t => taskCard(t)).join('');
}

function renderAll() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  let tasks = getTaskList();
  if (q) tasks = tasks.filter(t => (t.taskName||'').toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q));
  tasks.sort((a,b) => parseDate(a.revisionDate) - parseDate(b.revisionDate));
  const el = document.getElementById('list-all');
  el.innerHTML = tasks.length === 0 ? '<div class="empty-state">No tasks found.</div>' : tasks.map(t => taskCard(t)).join('');
}

function taskCard(t) {
  const ov = isOverdue(t.revisionDate), due = isToday(t.revisionDate);
  const daysOv = ov ? daysBetween(parseDate(t.revisionDate), new Date()) : 0;
  const nextSeq = (t.latestUsedSeqNumber === 0) ? 3 : (t.latestUsedSeqNumber + 2);
  const links = (t.links||[]).filter(l=>l).map((l,i)=>`<a href="${l}" target="_blank" rel="noopener">Link ${i+1}</a>`).join('');
  let tag = '';
  if (ov) tag = `<span class="overdue-tag">OVERDUE (${daysOv}d)</span>`;
  else if (due) tag = `<span class="due-tag">DUE TODAY</span>`;

  return `<div class="task-card ${ov?'overdue':''} ${due?'due-today':''}">
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div class="task-name">${esc(t.taskName)}</div>${tag}
    </div>
    <div class="task-meta">
      <span>📅 Rev: ${t.revisionDate}</span>
      <span>🔁 ×${t.repetitionCount}</span>
      <span class="seq-viz">Next: +${nextSeq}d</span>
      ${(t.overDueCount||0)>0?`<span style="color:var(--orange)">⚠ Skip:${t.overDueCount}</span>`:''}
      <span>📌 Since: ${t.firstDate}</span>
    </div>
    ${t.notes?`<div class="task-notes">${esc(t.notes)}</div>`:''}
    ${links?`<div class="task-links">${links}</div>`:''}
    <div class="task-actions">
      ${(due||ov)?`<button class="btn-green btn-sm" onclick="markDone('${t._key}')">✓ Done</button>`:''}
      ${ov?`<button class="btn-orange btn-sm" onclick="catchUpOne('${t._key}')">⚡ Catch-Up</button>`:''}
      <button class="btn-sm" onclick="editTask('${t._key}')">✏️ Edit</button>
      <button class="btn-red btn-sm" onclick="confirmDelete('${t._key}')">🗑</button>
    </div>
  </div>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// ACTIONS
// ============================================================
function markDone(key) {
  const task = allTasks[key];
  if (!task) return;
  // Snapshot for undo
  undoStack.push({ key, snapshot: {
    revisionDate: task.revisionDate,
    previousRevisionDate: task.previousRevisionDate,
    repetitionCount: task.repetitionCount,
    latestUsedSeqNumber: task.latestUsedSeqNumber
  }, name: task.taskName });
  if (undoStack.length > 10) undoStack.shift();

  const next = getNextRevision(task);
  updateTask(key, {
    revisionDate: next.newRevisionDate,
    previousRevisionDate: next.previousRevisionDate,
    repetitionCount: next.newRepetitionCount,
    latestUsedSeqNumber: next.newSeqNumber
  });
  showToastUndo(`Next: ${next.newRevisionDate} (+${next.newSeqNumber}d)`);
}

function undoLast() {
  if (!undoStack.length) return;
  const last = undoStack.pop();
  updateTask(last.key, last.snapshot);
  showToast(`↩ Undone: ${last.name}`);
}

function catchUpOne(key) {
  const task = allTasks[key]; if (!task) return;
  const r = catchUpTask(task);
  updateTask(key, r);
  showToast(`Caught up → ${r.revisionDate}`);
}

function catchUpAll() {
  const tasks = getTaskList().filter(t => isOverdue(t.revisionDate));
  tasks.forEach(t => updateTask(t._key, catchUpTask(t)));
  showToast(`Caught up ${tasks.length} tasks`);
}

function editTask(key) {
  const t = allTasks[key]; if (!t) return;
  document.getElementById('edit-id').value = key;
  document.getElementById('f-name').value = t.taskName || '';
  document.getElementById('f-links').value = (t.links||[]).join('\n');
  document.getElementById('f-notes').value = t.notes || '';
  document.getElementById('f-date').value = dateToHtml(t.firstDate);
  document.getElementById('form-title').textContent = 'Edit Task';
  switchTab('add');
}

function cancelEdit() {
  document.getElementById('edit-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-links').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('form-title').textContent = 'Add New Task';
  switchTab('today');
}

function saveTask() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Task name is required'); return; }
  const links = document.getElementById('f-links').value.split('\n').map(l=>l.trim()).filter(l=>l);
  const notes = document.getElementById('f-notes').value.trim();
  const dateInput = document.getElementById('f-date').value;
  const editKey = document.getElementById('edit-id').value;

  if (editKey) {
    updateTask(editKey, { taskName: name, links, notes });
    showToast('Task updated');
  } else {
    const dateStr = dateInput ? htmlToDate(dateInput) : todayStr();
    addTask({ taskName: name, firstDate: dateStr, revisionDate: dateStr, previousRevisionDate: dateStr,
      repetitionCount: -1, latestUsedSeqNumber: 0, overDueCount: 0, links, notes });
    showToast('Task added');
  }
  cancelEdit();
}

function confirmDelete(key) {
  const t = allTasks[key];
  if (confirm(`Delete "${t.taskName}"?`)) { deleteTask(key); showToast('Task deleted'); }
}

// ============================================================
// UI
// ============================================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['today','overdue','all','add'].forEach(v => document.getElementById('view-'+v).classList.toggle('hidden', v !== tab));
  renderCurrentTab();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = esc(msg);
  el.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
}

function showToastUndo(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span><button class="btn-undo btn-sm" onclick="undoLast()">↩ Undo</button>`;
  el.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);
}
</script>
</body>
</html>
